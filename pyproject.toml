[project]
name = "mentor-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "ScorbDev"}
]
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.14.0,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "greenlet (>=3.1.0,<4.0.0)",
    "openai (>=3.29.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "python-multipart (>=0.0.20,<0.1.0)"
]

[tool.poetry]
package-mode = false

# Local voice engine (torch + CUDA). Excluded from the Docker image,
# which uses the hosted KittenML backend instead.
[tool.poetry.group.voice.dependencies]
kittenml = ">=0.9.4,<0.10.0"
soundfile = ">=0.14.0,<0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<10.0.0"
pytest-asyncio = ">=0.24.0,<2.0.0"
ruff = ">=0.8.0,<1.0.0"
mypy = ">=1.13.0,<2.0.0"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["app/database/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
